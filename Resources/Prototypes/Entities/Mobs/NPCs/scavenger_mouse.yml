  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      200: Dead
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 0
  - type: NoSlip
  - type: ScavengerMouse
    hungerPerDomainUse: 50
    evolved: true
  - type: MouseAccent
  - type: Speech
    speechSounds: Squeak
    speechVerb: SmallMob
    allowedEmotes: ['Squeak']
  - type: Vocal
    sounds:
      Male: Mouse
      Female: Mouse
      Unsexed: Mouse
    wilhelmProbability: 0.001
  - type: Butcherable
    spawned:
    - id: FoodMeatRat
      amount: 3
    - id: LootSpawnerMaterialsHighValue
    - id: LootSpawnerMaterialsSurplus
      amount: 2
    - id: ToySpawner
  - type: MobPrice
    price: 2000 # mouse wealth, all stolen of course
    nameFormat: name-format-regal-rat
  - type: GuideHelp
    guides:
    - MinorAntagonists
  - type: Grammar
    attributes:
      gender: female
  - type: Puller
    needsHands: false
  - type: CanHostGuardian
  - type: NpcFactionMember
    factions:
      - Mouse
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: MouseCompound
  - type: IdExaminable
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-rat-king-name
    description: ghost-role-information-rat-king-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
    - VimPilot 
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: Crawler
  - type: StatusIcon

- type: entity
  parent: BaseAction
  id: ActionScavengerMouseDomain
  name: Scavenger's Domain
  description: Spend some hunger to release a cloud of ammonia into the air.
  components:
  - type: Action
    useDelay: 6
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: ratKingDomain
  - type: InstantAction
    event: !type:ScavengerMouseDomainActionEvent
